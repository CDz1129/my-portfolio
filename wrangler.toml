name = "my-portfolio"
main = "worker.mjs"
compatibility_date = "2024-11-01"

# Serve the built frontend from ./dist and let the Worker handle /api/*.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Native rate limiting for /api/* (per client IP). Remove this block to disable.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60
